version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Define aquí la URL del backend para que frontend la use (nombre del servicio + puerto interno)
      - env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
